:root{--ink:#2b2d42;--muted:#6b7090;--g:#06d6a0;--y:#ffd166;--r:#ef476f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eef7ff;color:var(--ink);font-family:"Andika",system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:"Baloo 2","Andika",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;box-shadow:0 2px 0 #d6e8f8;position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;flex:1;cursor:pointer}
.stars{font-weight:800;font-size:18px}
main{max-width:760px;margin:0 auto;padding:16px 14px 100px}
.hello{text-align:center;font-size:19px;margin:6px 0 14px}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pic{border:none;background:#fff;border-radius:22px;padding:10px;box-shadow:0 5px 0 #d6e8f8;cursor:pointer;font:800 17px "Baloo 2";color:var(--ink)}
.pic canvas{width:100%;border-radius:14px;display:block;margin-bottom:6px}
.lv{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.btn{border:none;border-radius:16px;padding:12px 18px;font:800 18px "Baloo 2";cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 0 #cfdff0}
.btn.on{background:var(--y)}.btn.main{background:var(--g)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.top h2{margin:0;flex:1;font-size:24px}
.grid{display:grid;gap:3px;background:#2b2d42;border-radius:16px;padding:3px;width:min(92vw,560px);aspect-ratio:1;margin:0 auto;touch-action:manipulation}
.pc{border-radius:6px;background-size:cover;cursor:pointer;transition:transform .15s,outline .15s;outline:0 solid transparent}
.pc.sel{transform:scale(.9);outline:5px solid var(--y);z-index:2}
.pc.ok{outline:3px solid var(--g);outline-offset:-3px}
.win .pc{outline:none;border-radius:0}.win{gap:0;padding:0}
.fb{text-align:center;font:800 22px "Baloo 2";min-height:34px;margin:10px 0}
.prev{display:block;margin:10px auto 0;width:120px;border-radius:12px;box-shadow:0 3px 0 #cfdff0}
.parent{background:#fff;border-radius:20px;padding:14px 16px;margin-top:20px;color:#444;line-height:1.5;font-size:15px}
@media(max-width:560px){.top h2{font-size:20px}}
</style>

var LV=[{n:"4 kawałki",k:2},{n:"9 kawałków",k:3},{n:"16 kawałków",k:4},{n:"25 kawałków",k:5}],lv=+ls("bystrzaki-puzle-lv")||0,G=null;
function img(k){var cv=document.createElement("canvas");cv.width=cv.height=S;var c=cv.getContext("2d");PICS[k].f(c);return cv.toDataURL("image/png")}
var CACHE={};function url(k){return CACHE[k]||(CACHE[k]=img(k))}
function menu(){try{speechSynthesis.cancel()}catch(e){}
 var h='<p class="hello">Wybierz obrazek i ułóż puzzle! 🧩</p><div class="lv">'+LV.map(function(L,i){return '<button class="btn'+(i===lv?" on":"")+'" onclick="setLv('+i+')">'+L.n+'</button>'}).join("")+'</div><div class="pics">';
 for(var k in PICS)h+='<button class="pic" onclick="start(\''+k+'\')"><canvas width="240" height="240" id="t_'+k+'"></canvas>'+PICS[k].n+'</button>';
 h+='</div><div class="parent">👨‍👩‍👧 <b>Dla rodzica:</b> Dziecko dotyka jednego kawałka, a potem drugiego. Wtedy kawałki zamieniają się miejscami. Kawałek na dobrym miejscu dostaje zieloną ramkę. Zacznijcie od 4 kawałków. Gdy idzie łatwo, wybierzcie 9 albo 16. Puzzle ćwiczą spostrzegawczość, cierpliwość i myślenie przestrzenne.</div>';
 app.innerHTML=h;for(var k2 in PICS){var t=document.getElementById("t_"+k2).getContext("2d");t.scale(.5,.5);PICS[k2].f(t)}}
function setLv(i){lv=i;ls("bystrzaki-puzle-lv",i);menu()}
function start(k){var n=LV[lv].k,N=n*n,o=[];for(var i=0;i<N;i++)o.push(i);
 do{for(var j=N-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=o[j];o[j]=o[r];o[r]=t}}while(o.every(function(v,i){return v===i}));
 G={k:k,n:n,o:o,sel:-1,moves:0,done:false};draw();say("Dotknij dwóch kawałków, żeby zamienić je miejscami.")}
function draw(msg){var n=G.n,u=url(G.k),h='<div class="top"><button class="btn" onclick="menu()">⬅</button><h2>🧩 '+PICS[G.k].n+' · '+LV[lv].n+'</h2><button class="btn" onclick="start(G.k)">🔁</button></div>';
 h+='<div class="grid'+(G.done?" win":"")+'" style="grid-template-columns:repeat('+n+',1fr)">';
 G.o.forEach(function(v,i){var x=v%n,y=Math.floor(v/n);h+='<div class="pc'+(i===G.sel?" sel":"")+(v===i&&!G.done?" ok":"")+'" onclick="tap('+i+')" style="background-image:url('+u+');background-size:'+(n*100)+'% '+(n*100)+'%;background-position:'+(n>1?x*100/(n-1):0)+'% '+(n>1?y*100/(n-1):0)+'%"></div>'});
 h+='</div><div class="fb">'+(msg||"")+'</div>';
 if(!G.done)h+='<img class="prev" src="'+u+'" alt="Podgląd obrazka">';else h+='<div class="lv"><button class="btn main" onclick="start(G.k)">🔁 Jeszcze raz</button><button class="btn main" onclick="menu()">🖼️ Inny obrazek</button></div>';
 app.innerHTML=h}
function tap(i){if(G.done)return;if(G.sel<0){G.sel=i;draw();return}if(G.sel===i){G.sel=-1;draw();return}
 var a=G.sel,t=G.o[a];G.o[a]=G.o[i];G.o[i]=t;G.sel=-1;G.moves++;
 if(G.o.every(function(v,j){return v===j})){G.done=true;var s=lv+1;star(s);draw("🏆 Brawo! Obrazek ułożony! +"+s+" ⭐");say("Brawo! Dobra robota!");return}
 var ok=(G.o[a]===a)+(G.o[i]===i);draw(ok?"✅ Pasuje!":"");if(ok)say("Super!")}
