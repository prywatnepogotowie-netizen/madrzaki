<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<script src="../profil.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zaprogramuj robota – programowanie dla dzieci – Bystrzaki</title>
<meta name="description" content="Pierwsze programowanie dla dzieci 5–9 lat bez czytania: ułóż strzałki i doprowadź robota do baterii. 12 poziomów, lektor, gwiazdki.">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--muted:#6b7090;--bg:#eef2ff;--r:#ef476f;--g:#06d6a0;--b:#4cc9f0;--y:#ffd166;--v:#7b61ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:"Baloo 2","Andika",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;box-shadow:0 2px 0 #d9defb;position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;flex:1;cursor:pointer}
.stars{font-weight:800;font-size:18px}
main{max-width:620px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h2{flex:1;margin:0;font-size:24px}
.btn{border:none;border-radius:16px;padding:11px 16px;font:800 18px "Baloo 2";cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);background:#fff;color:var(--ink)}
.btn.main{background:var(--g);box-shadow:0 5px 0 #04986f}.btn.red{background:#ffccd5}
.grid{display:grid;grid-template-rows:repeat(5,1fr);gap:6px;background:#c7cdf7;padding:8px;border-radius:22px;margin:0 auto;width:min(100%,430px);aspect-ratio:1}
.cell{background:#fff;border-radius:12px;display:grid;place-items:center;font-size:clamp(26px,8vw,44px);position:relative}
.cell.wall{background:#5c677d}
.cell.wall::after{content:"🧱";font-size:.8em}
.cell.trail{background:#d8f8ea}
.robot{position:absolute;inset:0;display:grid;place-items:center;transition:transform .25s}
.robot.bump{animation:bump .35s}
@keyframes bump{30%{transform:translateX(6px)}60%{transform:translateX(-6px)}}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:62px;background:#fff;border-radius:18px;padding:8px;margin:12px 0;box-shadow:0 4px 0 #d9defb;align-items:center}
.prog .cmd{width:46px;height:46px;border-radius:12px;background:var(--y);display:grid;place-items:center;font-size:26px;cursor:pointer;box-shadow:0 3px 0 #c99a1b}
.prog .cmd.run{background:var(--g);transform:scale(1.12)}
.prog .empty{color:var(--muted);font-size:15px;padding:0 6px}
.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,72px);gap:8px;justify-content:center}
.pad button{border:none;border-radius:18px;font-size:36px;cursor:pointer;background:var(--b);box-shadow:0 5px 0 #2a9fc4}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.levels button{border:none;border-radius:18px;padding:16px 0;font:800 26px "Baloo 2";cursor:pointer;background:#fff;box-shadow:0 5px 0 #d9defb;color:var(--ink)}
.levels button.done{background:var(--g);color:#fff;box-shadow:0 5px 0 #04986f}
.levels button.lock{opacity:.45}
.fb{text-align:center;font:800 26px "Baloo 2";min-height:36px;margin-top:8px}
.panel{background:#fff;border-radius:26px;padding:18px;box-shadow:0 6px 0 #d9defb;text-align:center}
.parent{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 5px 0 #d9defb;font-size:16px;line-height:1.55;margin-top:16px}
input.name{font:800 24px "Baloo 2";padding:10px 14px;border-radius:14px;border:3px solid #c7cdf7;width:100%;max-width:300px;text-align:center}
.hint{color:var(--muted);font-size:15px;text-align:center}
#home{position:fixed;left:12px;bottom:12px;z-index:9999;background:#2b2d42;color:#fff;text-decoration:none;font:700 15px system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header><h1 onclick="menu()">🤖 Zaprogramuj robota</h1><span class="stars">⭐ <span id="stars">0</span></span></header>
<main id="app"></main>
<a href="../index.html" id="home">🏠 Wszystkie gry</a>
<script>
var plV=null;function pv(){try{var l=speechSynthesis.getVoices().filter(function(v){return /^pl/i.test(v.lang)});function sc(v){var n=v.name,s=0;if(/natural|neural|online/i.test(n))s+=60;if(/premium/i.test(n))s+=55;if(/enhanced/i.test(n))s+=45;if(/google/i.test(n))s+=40;return s}plV=l.sort(function(a,b){return sc(b)-sc(a)})[0]||null}catch(e){}}
if("speechSynthesis" in window){pv();speechSynthesis.onvoiceschanged=pv;}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="pl-PL";if(plV)u.voice=plV;u.rate=0.98;u.pitch=1.0;speechSynthesis.speak(u)}catch(e){}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var stars=+ls("bystrzaki-robot-stars")||0;document.getElementById("stars").textContent=stars;
function star(n){stars+=n;document.getElementById("stars").textContent=stars;ls("bystrzaki-robot-stars",stars)}
var done=JSON.parse(ls("bystrzaki-robot-done")||"[]");
var RNAME=ls("bystrzaki-robot-name")||"";
// mapa: R robot, B bateria, # ściana, . puste ; 5x5
var LV=[
 ["R.B..",".....",".....",".....","....."],
 ["R....",".....","B....",".....","....."],
 ["R....",".....",".....",".....","...B."],
 ["R#...",".#...",".#B..",".....","....."],
 [".....",".###.","R#B#.",".....","....."],
 ["R....","####.",".....",".####","B...."],
 ["..#..","R.#.B","..#..",".....","....."],
 ["R...#","###.#","....#",".####","...B."],
 ["B#...",".#.#.",".#.#.",".#.#.","...#R"],
 ["R.#..",".##.#","....#","#.#..","..#.B"],
 [".....",".###.",".#B#.",".#.#.","R...."],
 ["R#...",".#.#.",".#.#.",".#.#.","...#B"]
];
var DIRS={up:[-1,0,"⬆️","do góry"],down:[1,0,"⬇️","w dół"],left:[0,-1,"⬅️","w lewo"],right:[0,1,"➡️","w prawo"]};
var app=document.getElementById("app"),L=null,prog=[],busy=false;
function rname(){return RNAME||"Robocik"}
function menu(){try{speechSynthesis.cancel()}catch(e){}
 if(!RNAME){naming();return;}
 var h='<p class="hint" style="font-size:19px;color:#2b2d42">🤖 '+rname()+' potrzebuje baterii 🔋! Wybierz poziom:</p><div class="levels">';
 LV.forEach(function(_,i){var unlocked=i===0||done.indexOf(i-1)>-1||done.indexOf(i)>-1;h+='<button class="'+(done.indexOf(i)>-1?"done":"")+(unlocked?"":" lock")+'" '+(unlocked?'onclick="level('+i+')"':'onclick="say(\'Najpierw przejdź poprzedni poziom\')"')+'>'+(unlocked?(i+1):"🔒")+'</button>'});
 h+='</div><div class="row"><button class="btn" onclick="naming()">✏️ Zmień imię robota</button></div>'+
 '<div class="parent">👨‍👩‍👧 <b>Dla rodzica:</b> to pierwsze programowanie, bez czytania. Dziecko układa najpierw cały „program” ze strzałek, a dopiero potem robot go wykonuje. Uczy to planowania, kolejności i szukania błędów („debugowania”). Jeśli robot nie doszedł, zapytaj: „Który krok był zły?”</div>';
 app.innerHTML=h;}
function naming(){
 app.innerHTML='<div class="panel"><div style="font-size:90px">🤖</div><h2>Jak ma się nazywać Twój robot?</h2><input class="name" id="nm" maxlength="14" value="'+(RNAME||"")+'" placeholder="np. Bzyk"><div class="row">'+
 ["Bzyk","Robo","Iskra","Śrubek"].map(function(n){return '<button class="btn" onclick="document.getElementById(\'nm\').value=\''+n+'\'">'+n+'</button>'}).join("")+
 '</div><div class="row"><button class="btn main" onclick="saveName()">✅ Gotowe</button></div></div>';
 say("Jak ma się nazywać Twój robot? Wpisz imię albo wybierz jedno z podpowiedzi.");}
function saveName(){var v=document.getElementById("nm").value.trim();RNAME=v||"Robocik";ls("bystrzaki-robot-name",RNAME);say("Cześć! Jestem "+RNAME+"! Pomożesz mi znaleźć baterię?");menu();}
function level(i){L={i:i,map:LV[i].map(function(r){return r.split("")})};prog=[];busy=false;
 for(var r=0;r<5;r++)for(var c=0;c<5;c++){if(L.map[r][c]==="R"){L.r=r;L.c=c;L.sr=r;L.sc=c;L.map[r][c]="."}}
 draw();say(i===0?"Ułóż strzałki, którymi "+rname()+" dojdzie do baterii. Potem naciśnij start!":"Poziom "+(i+1)+". Ułóż program i naciśnij start.");}
function draw(trail){
 var h='<div class="top"><button class="btn" onclick="menu()">⬅</button><h2>Poziom '+(L.i+1)+'</h2></div><div class="grid" id="grid" style="grid-template-columns:repeat(5,1fr)">';
 for(var r=0;r<5;r++)for(var c=0;c<5;c++){var t=L.map[r][c],cls="cell"+(t==="#"?" wall":"")+(trail&&trail[r+","+c]?" trail":"");
  h+='<div class="'+cls+'">'+(t==="B"?"🔋":"")+(r===L.r&&c===L.c?'<div class="robot" id="rb">🤖</div>':"")+'</div>';}
 h+='</div><div class="prog" id="prog">'+(prog.length?prog.map(function(d,k){return '<div class="cmd" title="usuń" onclick="del('+k+')">'+DIRS[d][2]+'</div>'}).join(""):'<span class="empty">👇 Tu pojawi się program. Klikaj strzałki!</span>')+'</div>'+
 '<div class="pad"><button class="up" onclick="add(\'up\')">⬆️</button><button class="left" onclick="add(\'left\')">⬅️</button><button class="down" onclick="add(\'down\')">⬇️</button><button class="right" onclick="add(\'right\')">➡️</button></div>'+
 '<div class="row"><button class="btn main" onclick="run()">▶ Start</button><button class="btn red" onclick="prog=[];reset()">🧹 Wyczyść</button></div><div class="fb" id="fb"></div>'+
 '<p class="hint">Kliknij strzałkę w programie, żeby ją usunąć.</p>';
 app.innerHTML=h;}
function add(d){if(busy||prog.length>=16)return;prog.push(d);say(DIRS[d][3]);reset();}
function del(k){if(busy)return;prog.splice(k,1);reset();}
function reset(){L.r=L.sr;L.c=L.sc;draw();}
function run(){if(busy)return;if(!prog.length){say("Najpierw ułóż strzałki!");return}
 busy=true;L.r=L.sr;L.c=L.sc;var k=0,trail={};trail[L.r+","+L.c]=1;draw(trail);
 (function step(){
  var cmds=document.querySelectorAll(".prog .cmd");cmds.forEach(function(x){x.classList.remove("run")});
  if(k>=prog.length){finish(false);return}
  cmds[k].classList.add("run");var d=DIRS[prog[k]],nr=L.r+d[0],nc=L.c+d[1];
  if(nr<0||nr>4||nc<0||nc>4||L.map[nr][nc]==="#"){var rb=document.getElementById("rb");rb.classList.add("bump");say("Bum! Tu jest ściana.");setTimeout(function(){finish(false,true)},700);return}
  L.r=nr;L.c=nc;trail[nr+","+nc]=1;draw(trail);var c2=document.querySelectorAll(".prog .cmd");c2[k].classList.add("run");
  if(L.map[nr][nc]==="B"){setTimeout(function(){finish(true)},400);return}
  k++;setTimeout(step,480);
 })();}
function finish(win,wall){busy=false;var fb=document.getElementById("fb");
 if(win){var first=done.indexOf(L.i)<0;if(first){done.push(L.i);ls("bystrzaki-robot-done",JSON.stringify(done));star(1)}
  fb.innerHTML="🔋 Hurra! "+rname()+" ma baterię!"+(first?" ⭐":"");say("Hurra! "+rname()+" ma baterię! Brawo, jesteś programistą!");
  var nx=document.createElement("div");nx.className="row";nx.innerHTML=(L.i<LV.length-1?'<button class="btn main" onclick="level('+(L.i+1)+')">➡ Następny poziom</button>':'<button class="btn main" onclick="menu()">🏆 Wszystkie poziomy!</button>');fb.after(nx);}
 else{fb.textContent=wall?"🧱 Ściana! Popraw program.":"Robot się zatrzymał. Jeszcze kawałek!";if(!wall)say("Robot nie doszedł do baterii. Dodaj albo popraw strzałki.");}}
menu();
</script>
<script src="../glos.js"></script>
</body>
</html>
