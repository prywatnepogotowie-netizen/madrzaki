<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<script src="../profil.js"></script>
<script src="../premium.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zaprogramuj robota – programowanie dla dzieci – Bystrzaki</title>
<meta name="description" content="Pierwsze programowanie dla dzieci 5–9 lat bez czytania: ułóż strzałki i doprowadź robota do baterii. 12 poziomów, lektor, gwiazdki.">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../ikona.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--muted:#6b7090;--bg:#eef2ff;--r:#ef476f;--g:#06d6a0;--b:#4cc9f0;--y:#ffd166;--v:#7b61ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:"Baloo 2","Andika",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;box-shadow:0 2px 0 #d9defb;position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;flex:1;cursor:pointer}
.stars{font-weight:800;font-size:18px}
main{max-width:620px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h2{flex:1;margin:0;font-size:24px}
.btn{border:none;border-radius:16px;padding:11px 16px;font:800 18px "Baloo 2";cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);background:#fff;color:var(--ink)}
.btn.main{background:var(--g);box-shadow:0 5px 0 #04986f}.btn.red{background:#ffccd5}
.grid{display:grid;gap:4px;background:#c7cdf7;padding:6px;border-radius:18px;margin:0 auto;width:min(100%,max(140px,calc(100vh - 445px)),560px);aspect-ratio:1}
.cell{background:#fff;border-radius:9px;display:grid;place-items:center;font-size:min(5vw,3.6vh,40px);position:relative}
.ctrl{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:nowrap;margin-top:4px}.side{display:flex;flex-direction:column;gap:6px;min-width:130px}.side .row{margin:0;gap:6px;flex-wrap:nowrap}.side .two .btn{width:auto;flex:1}.side .two .btn.red{flex:0 0 46px}.side .btn{padding:8px 10px;font-size:16px;width:100%}.side .reps .btn{width:auto;flex:1;padding:6px 0;min-width:0}.top{margin-bottom:6px!important}.top h2{font-size:22px}.prog{min-height:48px!important;margin:6px 0!important;padding:5px!important}@media (orientation:landscape) and (max-height:520px){#app.play{display:grid;grid-template-columns:auto 1fr;column-gap:18px;align-items:start}#app.play .top{grid-column:1/3}#app.play .grid{grid-column:1;grid-row:2/9;width:min(calc(100vh - 110px),48vw)!important}body.playing #bzbar,body.playing #home,body.playing #bzp,body.playing #bzg,body.playing #bzgl{display:none!important}body.playing{padding-bottom:0!important}body.playing header{padding:4px 12px}body.playing header h1{font-size:17px}#app.play .top{margin-bottom:4px!important}#app.play .top h2{font-size:17px}#app.play .top .btn{padding:4px 10px}main{padding-top:6px}#app.play>*:not(.grid):not(.top){grid-column:2}#app.play .prog{margin-top:0!important}}
@media (max-width:360px){.pad{grid-template-columns:repeat(3,48px)!important;grid-template-rows:repeat(2,48px)!important;gap:5px!important}.pad button{font-size:22px!important}.side{min-width:118px!important}.ctrl{gap:8px!important}.side .btn{font-size:14px!important;padding:7px 6px!important}}
@media (min-width:700px) and (min-height:700px){.pad{grid-template-columns:repeat(3,84px)!important;grid-template-rows:repeat(2,84px)!important;gap:10px!important}.pad button{font-size:40px!important}.side{min-width:200px!important;gap:10px!important}.side .btn{font-size:22px!important;padding:12px 14px!important}.prog .cmd{width:52px!important;height:52px!important;font-size:30px!important}@media (min-width:700px) and (min-height:700px){.grid{width:min(100%,max(200px,calc(100vh - 540px)),620px)}}
@media (orientation:landscape) and (min-width:900px){#app.play{display:grid;grid-template-columns:auto 1fr;column-gap:26px;align-items:start}#app.play .top{grid-column:1/3}#app.play .grid{grid-column:1;grid-row:2/9;width:min(calc(100vh - 190px),44vw)!important}#app.play>*:not(.grid):not(.top){grid-column:2}#app.play .prog{margin-top:0!important}main{max-width:1100px!important}}
.cnt{font-size:17px!important}}
.cnt{margin-top:4px!important;font-size:14px}.cnt{text-align:center;margin:8px 0 0;color:#6b7090}.prog .cmd{position:relative}.prog .cmd small{position:absolute;right:-4px;bottom:-6px;background:#2b2d42;color:#fff;border-radius:8px;font:800 13px system-ui;padding:1px 5px}.reps .rep{background:#ffd6a5;font-size:20px;min-width:64px}
.cell.wall{background:#5c677d}
.cell.wall::after{content:"🧱";font-size:.8em}
.cell.trail{background:#d8f8ea}
.robot{position:absolute;inset:0;display:grid;place-items:center;transition:transform .25s}
.robot.bump{animation:bump .35s}
@keyframes bump{30%{transform:translateX(6px)}60%{transform:translateX(-6px)}}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:62px;background:#fff;border-radius:18px;padding:8px;margin:12px 0;box-shadow:0 4px 0 #d9defb;align-items:center}
.prog .cmd{width:40px;height:40px;border-radius:12px;background:var(--y);display:grid;place-items:center;font-size:26px;cursor:pointer;box-shadow:0 3px 0 #c99a1b}
.prog .cmd.run{background:var(--g);transform:scale(1.12)}
.prog .empty{color:var(--muted);font-size:15px;padding:0 6px}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;justify-content:center}
.pad button{border:none;border-radius:14px;font-size:28px;cursor:pointer;background:var(--b);box-shadow:0 5px 0 #2a9fc4}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.levels button{border:none;border-radius:18px;padding:16px 0;font:800 26px "Baloo 2";cursor:pointer;background:#fff;box-shadow:0 5px 0 #d9defb;color:var(--ink)}
.levels button.done{background:var(--g);color:#fff;box-shadow:0 5px 0 #04986f}
.levels button.lock{opacity:.45}
.fb{text-align:center;font:800 26px "Baloo 2";min-height:36px;margin-top:8px}
.panel{background:#fff;border-radius:26px;padding:18px;box-shadow:0 6px 0 #d9defb;text-align:center}
.parent{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 5px 0 #d9defb;font-size:16px;line-height:1.55;margin-top:16px}
input.name{font:800 24px "Baloo 2";padding:10px 14px;border-radius:14px;border:3px solid #c7cdf7;width:100%;max-width:300px;text-align:center}
.hint{color:var(--muted);font-size:15px;text-align:center}
#home{position:fixed;left:12px;bottom:12px;z-index:9999;background:#2b2d42;color:#fff;text-decoration:none;font:700 15px system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header><h1 onclick="menu()">🤖 Zaprogramuj robota</h1><span class="stars">⭐ <span id="stars">0</span></span></header>
<main id="app"></main>
<a href="../index.html" id="home">🏠 Wszystkie gry</a>
<script>
var plV=null;function pv(){try{var l=speechSynthesis.getVoices().filter(function(v){return /^pl/i.test(v.lang)});function sc(v){var n=v.name,s=0;if(/natural|neural|online/i.test(n))s+=60;if(/premium/i.test(n))s+=55;if(/enhanced/i.test(n))s+=45;if(/google/i.test(n))s+=40;return s}plV=l.sort(function(a,b){return sc(b)-sc(a)})[0]||null}catch(e){}}
if("speechSynthesis" in window){pv();speechSynthesis.onvoiceschanged=pv;}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="pl-PL";if(plV)u.voice=plV;u.rate=0.98;u.pitch=1.0;speechSynthesis.speak(u)}catch(e){}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var stars=+ls("bystrzaki-robot-stars")||0;document.getElementById("stars").textContent=stars;
function star(n){stars+=n;document.getElementById("stars").textContent=stars;ls("bystrzaki-robot-stars",stars)}
var done=JSON.parse(ls("bystrzaki-robot-done")||"[]");
var RNAME=ls("bystrzaki-robot-name")||"";
// mapa: R robot, B bateria, # ściana, * gwiazdka, . puste
var LV=[{"m":[".....",".....",".B...","R....","....."],"best":2,"lim":null},{"m":["....R",".....",".....","...B.","....."],"best":4,"lim":null},{"m":["..R..",".....",".....",".....","....B"],"best":6,"lim":null},{"m":["#.B..","..#..",".....","...#.","..R.#"],"best":6,"lim":null},{"m":["..R..","..##.",".#B..","#.#..","...##"],"best":6,"lim":null},{"m":["R##B.","..#.#","#....","....#","....#"],"best":7,"lim":null},{"m":["B#...","..#..",".....","...#.","....R"],"best":8,"lim":null},{"m":["..#..",".....",".#...","R.##.",".#..B"],"best":9,"lim":null},{"m":["##....","...##.","...#R.","B.###.","##.#..","#.#.#."],"best":11,"lim":null},{"m":[".#....","##....","...#..","...##.","#.R##.","#.###B"],"best":10,"lim":null},{"m":["B.#.#.",".#.#.#","..##.R","..##.#","..#...","#...#."],"best":13,"lim":null},{"m":[".#..R.","....#.",".#.###","..#...","....B.","####.#"],"best":12,"lim":null},{"m":["##...#","#.....","#*..#R","#....B",".####.","...##."],"best":11,"lim":null},{"m":["......","B#...#","#...*.",".....#","..#.#.","....R."],"best":12,"lim":null},{"m":["#B.*.#","#.....",".*.#..",".##...",".#R..#","##.#.."],"best":13,"lim":null},{"m":["...#..","R#...*","..#..#","..#.#.",".B..#.",".#*.##"],"best":16,"lim":null},{"m":[".###...",".......","...#...","#...B#R",".#....#","......#","*.###.."],"best":20,"lim":13},{"m":[".#...*#","#..#.#.","..#..#.","B..#...","#....*.",".......","R.....#"],"best":21,"lim":16},{"m":["..#.###",".#.....","#...###","..#....","..##.*.","RB..#*.",".#..##."],"best":21,"lim":16},{"m":["#......","##*..##","#.##..B","...#.##","R#*#..*","##...#.","..#.##."],"best":22,"lim":15}];
var DIRS={up:[-1,0,"⬆️","do góry"],down:[1,0,"⬇️","w dół"],left:[0,-1,"⬅️","w lewo"],right:[0,1,"➡️","w prawo"]};
var app=document.getElementById("app"),L=null,prog=[],busy=false,AUTO=null;
var REP_FROM=8;
function rname(){return RNAME||"Robocik"}
function cap(){return L&&LV[L.i].lim||16}
function menu(){clearTimeout(AUTO);app.classList.remove("play");document.body.classList.remove("playing");try{speechSynthesis.cancel()}catch(e){}
 if(!RNAME){naming();return;}
 var h='<p class="hint" style="font-size:19px;color:#2b2d42">🤖 '+rname()+' potrzebuje baterii 🔋! Wybierz poziom:</p><div class="levels">';
 LV.forEach(function(_,i){var unlocked=i===0||done.indexOf(i-1)>-1||done.indexOf(i)>-1;h+='<button class="'+(done.indexOf(i)>-1?"done":"")+(unlocked?"":" lock")+'" '+(unlocked?'onclick="level('+i+')"':'onclick="say(\'Najpierw przejdź poprzedni poziom\')"')+'>'+(unlocked?(i+1):"🔒")+'</button>'});
 h+='</div><p class="hint">Poziomy 1–8: plansza 5×5 · 9–12: większa plansza i powtórzenia · 13–16: zbieranie gwiazdek ⭐ · 17–20: mało klocków, trzeba użyć powtórzeń.</p><div class="row"><button class="btn" onclick="naming()">✏️ Zmień imię robota</button></div>'+
 '<div class="parent">👨‍👩‍👧 <b>Dla rodzica:</b> to pierwsze programowanie, bez czytania. Dziecko układa najpierw cały „program” ze strzałek, a dopiero potem robot go wykonuje. Od poziomu 9 jest przycisk powtórzeń (×2, ×3, ×4), czyli pierwsza „pętla”. Od poziomu 13 robot musi zebrać gwiazdki przed baterią, a od 17 program może mieć tylko kilka klocków. Uczy to planowania, kolejności i szukania błędów („debugowania”). Jeśli robot nie doszedł, zapytaj: „Który krok był zły?”</div>';
 app.innerHTML=h;}
function naming(){app.classList.remove("play");
 app.innerHTML='<div class="panel"><div style="font-size:90px">🤖</div><h2>Jak ma się nazywać Twój robot?</h2><input class="name" id="nm" maxlength="14" value="'+(RNAME||"")+'" placeholder="np. Bzyk"><div class="row">'+
 ["Bzyk","Robo","Iskra","Śrubek"].map(function(n){return '<button class="btn" onclick="document.getElementById(\'nm\').value=\''+n+'\'">'+n+'</button>'}).join("")+
 '</div><div class="row"><button class="btn main" onclick="saveName()">✅ Gotowe</button></div></div>';
 say("Jak ma się nazywać Twój robot? Wpisz imię albo wybierz jedno z podpowiedzi.");}
function saveName(){var v=document.getElementById("nm").value.trim();RNAME=v||"Robocik";ls("bystrzaki-robot-name",RNAME);say("Cześć! Jestem "+RNAME+"! Pomożesz mi znaleźć baterię?");menu();}
function level(i){clearTimeout(AUTO);var m=LV[i].m;L={i:i,n:m.length,map:m.map(function(r){return r.split("")}),stars:0};prog=[];busy=false;
 for(var r=0;r<L.n;r++)for(var c=0;c<L.n;c++){if(L.map[r][c]==="R"){L.r=r;L.c=c;L.sr=r;L.sc=c;L.map[r][c]="."}if(L.map[r][c]==="*")L.stars++}
 L.got={};draw();
 var t=i===0?"Ułóż strzałki, żeby robot doszedł do baterii. Potem naciśnij start!":"Poziom "+(i+1)+". Ułóż program i naciśnij start.";
 if(i===REP_FROM)t="Poziom "+(i+1)+". Nowość! Przycisk razy dwa powtarza ostatnią strzałkę.";
 else if(i===12)t="Poziom "+(i+1)+". Zbierz wszystkie gwiazdki, a potem idź do baterii.";
 else if(i===16)t="Poziom "+(i+1)+". Masz mało klocków. Użyj powtórzeń!";
 say(t);}
function draw(trail){app.classList.add("play");document.body.classList.add("playing");var n=L.n,lim=cap(),rep=L.i>=REP_FROM;
 var h='<div class="top"><button class="btn" onclick="menu()">⬅</button><h2>Poziom '+(L.i+1)+(L.stars?' · ⭐ '+Object.keys(L.got).length+'/'+L.stars:'')+'</h2></div><div class="grid" id="grid" style="grid-template-columns:repeat('+n+',1fr);grid-template-rows:repeat('+n+',1fr)">';
 for(var r=0;r<n;r++)for(var c=0;c<n;c++){var t=L.map[r][c],k=r+","+c,cls="cell"+(t==="#"?" wall":"")+(trail&&trail[k]?" trail":"");
  h+='<div class="'+cls+'">'+(t==="B"?"🔋":"")+(t==="*"&&!L.got[k]?"⭐":"")+(r===L.r&&c===L.c?'<div class="robot" id="rb">🤖</div>':"")+'</div>';}
 h+='</div><div class="cnt">Klocki: <b>'+prog.length+' / '+lim+'</b>'+(LV[L.i].lim?' · najlepiej: '+(LV[L.i].lim-3):'')+'</div>';
 h+='<div class="prog" id="prog">'+(prog.length?prog.map(function(p,k){return '<div class="cmd" title="usuń" onclick="del('+k+')">'+DIRS[p.d][2]+(p.n>1?'<small>×'+p.n+'</small>':'')+'</div>'}).join(""):'<span class="empty">👇 Tu pojawi się program. Klikaj strzałki!</span>')+'</div>'+
 '<div class="ctrl"><div class="pad"><button class="up" onclick="add(\'up\')">⬆️</button><button class="left" onclick="add(\'left\')">⬅️</button><button class="down" onclick="add(\'down\')">⬇️</button><button class="right" onclick="add(\'right\')">➡️</button></div>'+
 '<div class="side">'+(rep?'<div class="row reps"><button class="btn rep" onclick="rep(2)">×2</button><button class="btn rep" onclick="rep(3)">×3</button><button class="btn rep" onclick="rep(4)">×4</button></div>':'')+
 '<button class="btn main" onclick="run()">▶ Start</button><div class="row two"><button class="btn" onclick="undo()">↩️ Cofnij</button><button class="btn red" onclick="prog=[];reset()">🧹</button></div></div></div><div class="fb" id="fb"></div>'+
 '<p class="hint">Kliknij strzałkę w programie, żeby ją usunąć.'+(rep?' Przycisk ×2, ×3 albo ×4 powtarza ostatnią strzałkę.':'')+'</p>';
 app.innerHTML=h;}
function add(d){if(busy)return;if(prog.length>=cap()){say("Za dużo klocków! Użyj powtórzeń.");return}prog.push({d:d,n:1});say(DIRS[d][3]);reset();}
function rep(n){if(busy||!prog.length)return;prog[prog.length-1].n=n;say("razy "+["","jeden","dwa","trzy","cztery"][n]);reset();}
function undo(){if(busy||!prog.length)return;prog.pop();reset();}
function del(k){if(busy)return;prog.splice(k,1);reset();}
function reset(){L.r=L.sr;L.c=L.sc;L.got={};draw();}
function run(){if(busy)return;if(!prog.length){say("Najpierw ułóż strzałki!");return}
 busy=true;L.r=L.sr;L.c=L.sc;L.got={};var steps=[];prog.forEach(function(p,bi){for(var j=0;j<p.n;j++)steps.push({d:p.d,b:bi})});
 var k=0,trail={};trail[L.r+","+L.c]=1;draw(trail);
 (function step(){
  function mark(){var c=document.querySelectorAll(".prog .cmd");c.forEach(function(x){x.classList.remove("run")});if(k<steps.length&&c[steps[k].b])c[steps[k].b].classList.add("run")}
  if(k>=steps.length){finish(false);return}
  mark();var d=DIRS[steps[k].d],nr=L.r+d[0],nc=L.c+d[1];
  if(nr<0||nr>=L.n||nc<0||nc>=L.n||L.map[nr][nc]==="#"){var rb=document.getElementById("rb");rb.classList.add("bump");say("Bum! Tu jest ściana.");setTimeout(function(){finish(false,true)},700);return}
  L.r=nr;L.c=nc;var key=nr+","+nc;trail[key]=1;if(L.map[nr][nc]==="*"&&!L.got[key]){L.got[key]=1}
  draw(trail);mark();
  if(L.map[nr][nc]==="B"){if(Object.keys(L.got).length>=L.stars){setTimeout(function(){finish(true)},400);return}}
  k++;setTimeout(step,420);
 })();}
function finish(win,wall){busy=false;var fb=document.getElementById("fb");
 if(win){var first=done.indexOf(L.i)<0;if(first){done.push(L.i);ls("bystrzaki-robot-done",JSON.stringify(done));star(1)}
  var last=L.i>=LV.length-1;fb.innerHTML="🔋 Hurra! "+rname()+" ma baterię!"+(first?" ⭐":"")+(last?"":"<br><small>Za chwilę następny poziom…</small>");
  say(last?"Brawo! Przeszedłeś wszystkie poziomy!":"Hurra! Brawo, jesteś programistą!");
  var nx=document.createElement("div");nx.className="row";nx.innerHTML=(last?'<button class="btn main" onclick="menu()">🏆 Wszystkie poziomy!</button>':'<button class="btn main" onclick="level('+(L.i+1)+')">➡ Dalej</button>');fb.after(nx);
  if(!last){var nxt=L.i+1;AUTO=setTimeout(function(){level(nxt)},3200)}}
 else{var miss=L.stars&&Object.keys(L.got).length<L.stars;fb.textContent=wall?"🧱 Ściana! Popraw program.":(miss?"⭐ Najpierw zbierz wszystkie gwiazdki!":"Robot się zatrzymał. Jeszcze kawałek!");
  if(!wall)say(miss?"Najpierw zbierz wszystkie gwiazdki!":"Robot nie doszedł do baterii. Dodaj albo popraw strzałki.");}}
menu();
</script>
<script src="../glos.js"></script>
</body>
</html>
