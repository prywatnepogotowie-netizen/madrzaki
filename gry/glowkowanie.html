<!DOCTYPE html>

<script>
/* Bystrzaki: wybór najładniejszego polskiego głosu */
window.bestPl=function(list){
  list=(list||[]).filter(function(v){return /^pl/i.test(v.lang)});
  if(!list.length)return null;
  var bad=/eloquence|grandma|grandpa|rocko|shelley|flo|reed|sandy|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph/i;
  function score(v){var n=v.name,s=0;
    if(bad.test(n))s-=100;
    if(/natural|neural|online/i.test(n))s+=60;
    if(/premium/i.test(n))s+=55;
    if(/enhanced|ulepszon/i.test(n))s+=45;
    if(/google/i.test(n))s+=40;
    if(/zosia|zofia|paulina|agnieszka|ewa|maja|marta/i.test(n))s+=10;
    if(v.localService===false)s+=5;
    return s;}
  return list.sort(function(a,b){return score(b)-score(a)})[0];
};
</script>

<style>

<body>
<header><h1 id="home">🧠 Główkowanie</h1><span class="stars">⭐ <span id="stars">0</span></span></header>
<main id="app"></main>
<script>
const APP="logika";
const $=s=>document.querySelector(s), app=$("#app");
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function store(k,v){try{if(v===undefined)return localStorage.getItem(APP+"_"+k);localStorage.setItem(APP+"_"+k,v)}catch(e){return null}}
let stars=+store("stars")||0;
function saveStars(){$("#stars").textContent=stars;store("stars",stars)}
saveStars();
// mowa
let voices={};
function pickVoices(){try{const v=speechSynthesis.getVoices();voices.pl=bestPl(v);voices.en=v.find(x=>/^en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
if("speechSynthesis" in window){pickVoices();speechSynthesis.onvoiceschanged=pickVoices;}
function say(t,lang="pl",rate=0.95,queue=false){try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang==="en"?"en-GB":"pl-PL";if(voices[lang])u.voice=voices[lang];u.rate=rate;u.pitch=1.0;speechSynthesis.speak(u)}catch(e){}}
const PRAISE=["Brawo!","Super!","Świetnie!","Ekstra!","Wspaniale!","Tak jest!","Doskonale!"];
function cheer(x,y,add=true){
  if(add){stars++;saveStars();}
  const l=["⭐","🌟","✨","🎉","💛"];
  for(let i=0;i<12;i++){const b=document.createElement("div");b.className="burst";b.textContent=l[i%5];
    b.style.left=(x||innerWidth/2)+"px";b.style.top=(y||innerHeight/2)+"px";
    const a=Math.random()*Math.PI*2,r=90+Math.random()*120;
    b.style.setProperty("--dx",Math.cos(a)*r+"px");b.style.setProperty("--dy",Math.sin(a)*r+"px");
    document.body.appendChild(b);setTimeout(()=>b.remove(),1000);}
}
function bar(title,speak){return `<div class="bar"><button class="back" id="bk">⬅</button><h2>${title}</h2>${speak?'<button class="spk" id="sp">🔊</button>':""}</div>`}
function bindBar(onSpeak){$("#bk").onclick=menu; if(onSpeak&&$("#sp"))$("#sp").onclick=onSpeak;}
// silnik quizu: task = {html, opts:[{label,val}], ans, speak, speakLang, after, afterSpeak, hint, cols, onShow}
function game(title,makeTask,ROUND=10){
  let n=0,score=0;
  const next=()=>{
    if(n>=ROUND) return finish();
    const t=makeTask(); let tries=0;
    app.innerHTML=bar(title,!!t.speak)+`<div class="progress"><i style="width:${n/ROUND*100}%"></i></div>
      <div class="panel">${t.html}
      <div class="opts ${t.cols?"c"+t.cols:""}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.label}</button>`).join("")}</div>
      <div class="msg" id="msg"></div></div>`;
    const sp=()=>say(t.speak,t.speakLang||"pl",t.rate||0.85);
    bindBar(sp); if(t.speak&&!t.noAuto) sp(); if(t.onShow) t.onShow();
    app.querySelectorAll(".opt").forEach(b=>b.onclick=e=>{
      const o=t.opts[+b.dataset.i];
      if(o.val===t.ans){
        b.classList.add("good"); app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        const p=pick(PRAISE); $("#msg").className="msg ok"; $("#msg").innerHTML=p+(t.after?" "+t.after:"");
        say(p+(t.afterSpeak?" "+t.afterSpeak:"")); if(tries===0)score++; cheer(e.clientX,e.clientY);
        n++; setTimeout(next,t.wait||2000);
      }else{
        tries++; b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
        $("#msg").className="msg no"; $("#msg").innerHTML=(t.hint&&tries>1)?t.hint:"Spróbuj jeszcze raz 🙂"; say(t.wrongSay||"Spróbuj jeszcze raz");
      }
    });
  };
  const finish=()=>{
    const txt=score>=ROUND-1?"Jesteś mistrzem!":score>=ROUND*0.6?"Bardzo ładnie!":"Dobra robota, ćwiczymy dalej!";
    app.innerHTML=bar(title)+`<div class="panel"><div class="big-emoji">🏆</div><div class="q" style="font-size:52px">${score} / ${ROUND}</div>
      <div class="msg ok">${txt}</div><button class="btn" id="ag">🔁 Jeszcze raz</button><button class="btn y" id="mn">🏠 Menu</button></div>`;
    bindBar(); $("#mn").onclick=menu; $("#ag").onclick=()=>game(title,makeTask,ROUND); say(txt);
  };
  next();
}
function menuOf(hello,tiles,extraTop=""){
  try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=`<p class="hello">${hello}</p>${extraTop}<div class="menu">${tiles.map((t,i)=>`<button class="tile" style="background:${t.bg}" data-i="${i}"><span class="ic">${t.ic}</span>${t.name}<small>${t.sub||""}</small></button>`).join("")}</div>`;
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>tiles[+b.dataset.i].go());
}
function parentsPage(html){
  app.innerHTML=bar("👨‍👩‍👦 Dla rodzica")+html+`<div style="text-align:center"><button class="btn" id="test">🔊 Test głosu</button><button class="btn y" id="reset">🔄 Wyzeruj gwiazdki</button></div>`;
  bindBar(); $("#test").onclick=()=>say("Cześć! Gotowy do zabawy?"); $("#reset").onclick=()=>{stars=0;saveStars()};
}
$("#home").onclick=()=>menu();
const PALS=[["🔴","🔵","🟡","🟢","🟣"],["🐶","🐱","🐭","🐰","🐻"],["🍎","🍌","🍇","🍓","🍐"],["⭐","🌙","☀️","☁️","⚡"],["🚗","🚲","✈️","🚂","⛵"]];
const PATTERNS=[[[0,1],"AB"],[[0,0,1],"AAB"],[[0,1,1],"ABB"],[[0,1,2],"ABC"],[[0,1,2,1],"ABCB"],[[0,0,1,1],"AABB"]];
let level=+store("level")||0;
function tPattern(){
  const pats=level?PATTERNS:PATTERNS.slice(0,3);
  const [p]=pick(pats), pal=shuffle(pick(PALS)), shown=R(p.length+3,p.length*2+2);
  const seq=[...Array(shown+1)].map((_,i)=>pal[p[i%p.length]]), ans=seq[shown];
  const o=shuffle([ans,...pal.filter(x=>x!==ans).slice(0,2)]);
  return {html:`<p class="hint">Co będzie dalej?</p><div class="pat">${seq.slice(0,shown).map(x=>`<span>${x}</span>`).join("")}<span class="qm">?</span></div>`,
    opts:o.map(x=>({label:x,val:x})),ans,cols:3,speak:"Co będzie dalej?",after:"",afterSpeak:"",hint:"Znajdź, co się powtarza",
    onShow:()=>app.querySelectorAll(".opt").forEach(b=>b.classList.add("em"))};
}
const GROUPS=[["owoce","🍎🍌🍇🍓🍐🍒🍑🍍"],["zwierzęta","🐶🐱🐭🐰🐻🦁🐸🐵"],["pojazdy","🚗🚲✈️🚂⛵🚌🚀🚜"],["ubrania","👕👖👗🧦🧢🧥🧤🧣"],["warzywa","🥕🥦🌽🥒🍅🥔🧅🫑"],["sport","⚽🏀🎾🏐🏈⚾🏓🥊"],["pogoda","☀️🌧️❄️⛈️🌈☁️🌬️🌫️"],["instrumenty","🎸🥁🎺🎻🎹🪗🎷🪘"]];
const em=s=>[...new Intl.Segmenter().segment(s)].map(x=>x.segment);
function tOdd(){
  const [g1,g2]=shuffle(GROUPS); const three=shuffle(em(g1[1])).slice(0,3), odd=pick(em(g2[1]));
  const all=shuffle([...three,odd]);
  return {html:`<p class="hint">Co tu nie pasuje?</p>`,opts:all.map(x=>({label:x,val:x})),ans:odd,
    speak:"Co tu nie pasuje?",after:`Reszta to ${g1[0]}.`,afterSpeak:`Bo reszta to ${g1[0]}`,hint:"Co łączy trzy obrazki?",
    onShow:()=>app.querySelectorAll(".opt").forEach(b=>b.classList.add("em"))};
}
function memory(){
  const pairs=level?8:6, cols=4;
  const pool=shuffle(em("🐶🐱🦁🐸🐵🐻🐰🦊🐼🐨🐯🐷🐮🐔🐧🦄")).slice(0,pairs);
  const cards=shuffle([...pool,...pool]); let open=[],done=0,moves=0,lock=false;
  app.innerHTML=bar("🃏 Memory",true)+`<div class="panel"><p class="hint">Znajdź pary. Ruchy: <b id="mv">0</b></p>
    <div class="mem" style="grid-template-columns:repeat(${cols},1fr)">${cards.map((c,i)=>`<button class="mc" data-i="${i}"><span></span></button>`).join("")}</div>
    <div class="msg" id="msg"></div></div>`;
  bindBar(()=>say("Odkrywaj po dwie karty i szukaj par."));
  app.querySelectorAll(".mc").forEach(b=>b.onclick=e=>{
    if(lock||b.classList.contains("open")||b.classList.contains("done"))return;
    const i=+b.dataset.i; b.classList.add("open"); b.firstChild.textContent=cards[i]; open.push(b);
    if(open.length===2){moves++;$("#mv").textContent=moves;const [a,c]=open;
      if(cards[+a.dataset.i]===cards[+c.dataset.i]){a.classList.add("done");c.classList.add("done");open=[];done++;say(pick(["Para!","Jest!","Super!"]),"pl",1);
        if(done===pairs){$("#msg").className="msg ok";$("#msg").innerHTML=`Wszystkie pary w ${moves} ruchach! <button class="btn" id="ag">🔁 Jeszcze raz</button>`;say("Brawo! Znalazłeś wszystkie pary");cheer(e.clientX,e.clientY);$("#ag").onclick=memory;}}
      else{lock=true;setTimeout(()=>{a.classList.remove("open");c.classList.remove("open");a.firstChild.textContent="";c.firstChild.textContent="";open=[];lock=false},900)}}
  });
}
// robot
const DIRS={"⬆️":[0,-1],"⬇️":[0,1],"⬅️":[-1,0],"➡️":[1,0]};
function makeLevel(){
  const N=5;
  for(let t=0;t<200;t++){
    const rb=[R(0,4),R(0,4)], st=[R(0,4),R(0,4)];
    const dist=Math.abs(rb[0]-st[0])+Math.abs(rb[1]-st[1]); if(dist<(level?5:3)||dist>(level?8:5))continue;
    const walls=new Set(); const nw=level?R(4,7):R(1,3);
    while(walls.size<nw){const w=[R(0,4),R(0,4)];const k=w+"";if(k!==rb+""&&k!==st+"")walls.add(k)}
    // BFS
    const q=[[...rb,0]],seen=new Set([rb+""]);let best=-1;
    while(q.length){const [x,y,d]=q.shift(); if(x===st[0]&&y===st[1]){best=d;break}
      for(const [dx,dy] of Object.values(DIRS)){const nx=x+dx,ny=y+dy,k=nx+","+ny; if(nx<0||ny<0||nx>=N||ny>=N||walls.has(k)||seen.has(k))continue; seen.add(k);q.push([nx,ny,d+1])}}
    if(best>0&&best<=10) return {rb,st,walls,best};
  }
  return {rb:[0,0],st:[2,2],walls:new Set(),best:4};
}
function robot(){
  let L=makeLevel(), prog=[], pos=[...L.rb], running=false, trail=new Set();
  const cell=(x,y)=>{const k=x+","+y; if(pos[0]===x&&pos[1]===y)return "🤖"; if(L.st[0]===x&&L.st[1]===y)return "⭐"; if(L.walls.has(k))return "🪨"; return ""};
  const draw=(act=-1)=>{
    app.innerHTML=bar("🤖 Robot",true)+`<div class="panel"><p class="hint">Ułóż strzałki, żeby robot doszedł do gwiazdki. Omijaj kamienie!</p>
      <div class="gridR">${[...Array(25)].map((_,i)=>{const x=i%5,y=Math.floor(i/5);return `<div class="gc ${trail.has(x+","+y)?"path":""}">${cell(x,y)}</div>`}).join("")}</div>
      <div class="prog">${prog.map((p,i)=>`<span data-i="${i}" class="${i===act?"act":""}">${p}</span>`).join("")||'<span class="hint">tu pojawią się strzałki</span>'}</div>
      <div class="pad"><button class="clr" id="cl">🧽</button><button data-d="⬆️">⬆️</button><button class="clr" id="un">↩️</button>
       <button data-d="⬅️">⬅️</button><button data-d="⬇️">⬇️</button><button data-d="➡️">➡️</button></div>
      <button class="btn" id="go">▶ Start</button><button class="btn y" id="nw">🔀 Nowa plansza</button><div class="msg" id="msg"></div></div>`;
    bindBar(()=>say("Ułóż strzałki, żeby robot doszedł do gwiazdki."));
    app.querySelectorAll(".pad [data-d]").forEach(b=>b.onclick=()=>{if(running||prog.length>=14)return;prog.push(b.dataset.d);draw()});
    $("#un").onclick=()=>{if(!running){prog.pop();draw()}}; $("#cl").onclick=()=>{if(!running){prog=[];pos=[...L.rb];trail.clear();draw()}};
    app.querySelectorAll(".prog [data-i]").forEach(s=>s.onclick=()=>{if(!running){prog.splice(+s.dataset.i,1);draw()}});
    $("#nw").onclick=()=>{if(!running){L=makeLevel();prog=[];pos=[...L.rb];trail.clear();draw()}};
    $("#go").onclick=run;
  };
  const run=async e=>{
    if(running||!prog.length)return; running=true; pos=[...L.rb]; trail=new Set([pos+""]);
    for(let i=0;i<prog.length;i++){
      const [dx,dy]=DIRS[prog[i]]; const nx=pos[0]+dx, ny=pos[1]+dy;
      if(nx<0||ny<0||nx>4||ny>4||L.walls.has(nx+","+ny)){draw(i);$("#msg").className="msg no";$("#msg").textContent="Bum! Robot się zatrzymał 🪨";say("Bum! Spróbuj poprawić strzałki.");running=false;return}
      pos=[nx,ny];trail.add(pos+"");draw(i);await new Promise(r=>setTimeout(r,450));
      if(pos[0]===L.st[0]&&pos[1]===L.st[1])break;
    }
    if(pos[0]===L.st[0]&&pos[1]===L.st[1]){
      $("#msg").className="msg ok";$("#msg").textContent=prog.length===L.best?"Brawo! Najkrótsza droga! 🏆":"Brawo! Robot ma gwiazdkę!";say("Brawo! Robot dotarł do gwiazdki!");cheer();
      setTimeout(()=>{L=makeLevel();prog=[];pos=[...L.rb];trail.clear();running=false;draw()},2400);
    }else{$("#msg").className="msg no";$("#msg").textContent="Robot nie doszedł do gwiazdki – dodaj strzałki";say("Jeszcze nie. Dodaj strzałki.");running=false}
  };
  draw(); say("Ułóż strzałki, żeby robot doszedł do gwiazdki.");
}
const SIZES=[["🐭","🐱","🐶","🐴","🐘"],["🐜","🐞","🐦","🐕","🐄"],["🫐","🍒","🍎","🍈","🍉"],["🚲","🚗","🚌","✈️","🚀"]];
function tSize(){
  const s=pick(SIZES), [a,b]=shuffle(s.map((x,i)=>i)).slice(0,2), big=Math.random()<.5;
  const ans=big?(a>b?s[a]:s[b]):(a<b?s[a]:s[b]);
  return {html:`<p class="hint">${big?"Co jest większe w prawdziwym życiu?":"Co jest mniejsze w prawdziwym życiu?"}</p>`,opts:[s[a],s[b]].map(x=>({label:x,val:x})),ans,
    speak:big?"Co jest większe naprawdę?":"Co jest mniejsze naprawdę?",after:"",afterSpeak:"",onShow:()=>app.querySelectorAll(".opt").forEach(b=>b.classList.add("em"))};
}
function menu(){
  const seg=`<div class="seg">${["Łatwe","Trudniejsze"].map((n,i)=>`<button class="sg ${i===level?"on":""}" data-l="${i}">${n}</button>`).join("")}</div>`;
  menuOf("Cześć! Pogłówkujemy? 🧠",[
    {ic:"🔴🔵",name:"Co dalej?",sub:"dokończ wzór",bg:"var(--c1)",go:()=>game("🔴🔵 Co dalej?",tPattern)},
    {ic:"🙃",name:"Co nie pasuje?",sub:"znajdź intruza",bg:"var(--c2)",go:()=>game("🙃 Co nie pasuje?",tOdd)},
    {ic:"🃏",name:"Memory",sub:"znajdź pary",bg:"var(--c5)",go:memory},
    {ic:"🤖",name:"Robot",sub:"programowanie strzałkami",bg:"var(--c3)",go:robot},
    {ic:"🐘",name:"Większe – mniejsze",sub:"porównaj",bg:"var(--c6)",go:()=>game("🐘 Większe – mniejsze",tSize,8)},
    {ic:"👨‍👩‍👦",name:"Dla rodzica",sub:"jak ćwiczyć",bg:"#fff",go:parents}
  ],seg);
  app.querySelectorAll(".sg").forEach(b=>b.onclick=()=>{level=+b.dataset.l;store("level",level);menu()});
}
function parents(){parentsPage(`<div class="tip"><h3>Jak korzystać</h3><ul>
 <li><b>Poziom</b> nad menu: <b>Łatwe</b> / <b>Trudniejsze</b> (dłuższe wzory, 8 par w memory, więcej kamieni i dłuższa droga robota).</li>
 <li><b>Co dalej?</b> – rytmy (AB, AAB, ABC…). Uczą dostrzegania reguł, to podstawa matematyki.</li>
 <li><b>Co nie pasuje?</b> – klasyfikowanie (owoce, zwierzęta, pojazdy…). Po odpowiedzi lektor mówi, co łączy resztę. Dobrze zapytać dziecko „dlaczego?”.</li>
 <li><b>Robot</b> – pierwsze programowanie: dziecko układa całą listę strzałek i dopiero wtedy uruchamia robota. Strzałkę z listy usuwa się dotknięciem, ↩️ cofa ostatnią, 🧽 czyści.</li>
 <li><b>Memory</b> ćwiczy pamięć i koncentrację – licznik ruchów pozwala bić własny rekord.</li>
</ul></div>`)}
menu();
</script>
