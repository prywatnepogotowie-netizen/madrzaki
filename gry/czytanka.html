<!DOCTYPE html>
<html lang="pl">
<head>
<script>
/* Bystrzaki: wybór najładniejszego polskiego głosu */
window.bestPl=function(list){
  list=(list||[]).filter(function(v){return /^pl/i.test(v.lang)});
  if(!list.length)return null;
  var bad=/eloquence|grandma|grandpa|rocko|shelley|flo|reed|sandy|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph/i;
  function score(v){var n=v.name,s=0;
    if(bad.test(n))s-=100;
    if(/natural|neural|online/i.test(n))s+=60;
    if(/premium/i.test(n))s+=55;
    if(/enhanced|ulepszon/i.test(n))s+=45;
    if(/google/i.test(n))s+=40;
    if(/zosia|zofia|paulina|agnieszka|ewa|maja|marta/i.test(n))s+=10;
    if(v.localService===false)s+=5;
    return s;}
  return list.sort(function(a,b){return score(b)-score(a)})[0];
};
</script>

<title>Czytanka – nauka czytania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#2b2d42; --muted:#7a7f99;
  --s1:#e63946; --s2:#1d4ed8; --ok:#16a34a; --bad:#dc2626;
  --c1:#ffd166; --c2:#06d6a0; --c3:#4cc9f0; --c4:#f78fb3; --c5:#b197fc; --c6:#ff9f43;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;box-shadow:0 2px 0 #f1e4cc;position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;flex:1;display:flex;align-items:center;gap:8px;cursor:pointer}
.pill{border:none;background:#fff3d6;color:var(--ink);font:700 16px "Andika";padding:8px 12px;border-radius:999px;cursor:pointer}
.stars{font-weight:700;font-size:18px}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:16px}
button{font-family:inherit}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:8px}
.tile{border:none;border-radius:24px;padding:22px 12px;font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .08s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tile .ic{font-size:46px;display:block;margin-bottom:6px}
.tile small{display:block;font-size:14px;font-weight:400;color:#444;margin-top:4px}
.hello{text-align:center;margin:6px 0 4px;font-size:20px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top h2{margin:0;font-size:24px;flex:1}
.back{border:none;background:#fff;border-radius:14px;padding:10px 14px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #eadbc0}
.grid{display:grid;gap:10px}
.letters{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
.key{border:none;background:#fff;border-radius:18px;font-size:34px;font-weight:700;padding:14px 0;cursor:pointer;box-shadow:0 4px 0 #eadbc0;color:var(--ink)}
.key.vow{color:var(--s1)}
.key.sel{background:var(--c1)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #eadbc0}
.panel{background:#fff;border-radius:28px;padding:22px 16px;text-align:center;box-shadow:0 6px 0 #eadbc0;margin-bottom:16px}
.big{font-size:96px;font-weight:700;line-height:1.05}
.emoji{font-size:84px;line-height:1.1;min-height:92px}
.word{font-size:64px;font-weight:700;letter-spacing:2px;line-height:1.2;word-break:break-word}
.syl{display:inline-block;padding:0 4px;border-radius:12px;cursor:pointer}
.syl:nth-child(odd){color:var(--s1)} .syl:nth-child(even){color:var(--s2)}
.syl.hi{background:var(--c1)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:18px;padding:14px 20px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);background:var(--c3);color:#06263a}
.btn.alt{background:var(--c1);color:#3d2c00}
.btn.go{background:var(--c2);color:#033}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.syls{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.syls .key{font-size:44px;padding:20px 0}
.syls .key:nth-child(odd){color:var(--s1)} .syls .key:nth-child(even){color:var(--s2)}
.levels{display:flex;gap:6px}
.lv{border:none;border-radius:12px;padding:8px 12px;font-weight:700;font-size:16px;background:#fff;cursor:pointer;box-shadow:0 3px 0 #eadbc0}
.lv.on{background:var(--c5);color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.opt{border:none;background:#fff;border-radius:24px;font-size:64px;padding:18px 0;cursor:pointer;box-shadow:0 5px 0 #eadbc0}
.opt.good{background:#d1fae5;box-shadow:0 5px 0 #86efac}
.opt.wrong{animation:shake .4s;background:#fee2e2}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.slots{display:flex;justify-content:center;gap:8px;min-height:84px;flex-wrap:wrap;margin:10px 0}
.slot{min-width:90px;height:80px;border:3px dashed #e3cfa8;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
.slot.f1{border-style:solid;border-color:transparent;background:#fff1f2;color:var(--s1)}
.slot.f2{border-style:solid;border-color:transparent;background:#eff6ff;color:var(--s2)}
.pieces{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.piece{border:none;background:var(--c1);border-radius:18px;padding:14px 18px;font-size:38px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #e0a800;color:#3d2c00}
.piece[disabled]{visibility:hidden}
.msg{font-size:28px;font-weight:700;min-height:40px;margin-top:8px}
.msg.ok{color:var(--ok)} .msg.no{color:var(--bad)}
.progress{height:12px;background:#f1e4cc;border-radius:99px;overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--c2);width:0;transition:width .3s}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:8px 0}
.tip{background:#fff;border-radius:20px;padding:16px 18px;margin-top:16px;font-size:15.5px;line-height:1.5;box-shadow:0 4px 0 #eadbc0}
.tip h3{margin:0 0 6px;font-size:18px}
.tip ul{margin:6px 0 0;padding-left:20px}
.burst{position:fixed;pointer-events:none;font-size:34px;z-index:20;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.lower .uc{text-transform:lowercase}
.warn{background:#fee2e2;color:#7f1d1d;border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<header>
  <h1 id="home">📚 Czytanka</h1>
  <button class="pill" id="caseBtn" title="Wielkie / małe litery">AA</button>
  <span class="stars">⭐ <span id="stars">0</span></span>
</header>
<main id="app"></main>

<script>
// ---------- DANE ----------
const LETTERS = [
 ["A","arbuz","🍉"],["Ą","wąż","🐍"],["B","banan","🍌"],["C","cebula","🧅"],["Ć","pięć","🖐️"],
 ["D","dom","🏠"],["E","ekran","📺"],["Ę","gęś","🪿"],["F","foka","🦭"],["G","grzyb","🍄"],
 ["H","hipopotam","🦛"],["I","igła","🪡"],["J","jabłko","🍎"],["K","kot","🐱"],["L","lis","🦊"],
 ["Ł","łódka","⛵"],["M","mama","👩"],["N","nos","👃"],["Ń","koń","🐴"],["O","okno","🪟"],
 ["Ó","ósemka","8️⃣"],["P","pies","🐶"],["R","ryba","🐟"],["S","słoń","🐘"],["Ś","ślimak","🐌"],
 ["T","tort","🎂"],["U","ucho","👂"],["W","wieloryb","🐳"],["Y","dynia","🎃"],["Z","zebra","🦓"],
 ["Ź","źrebak","🐎"],["Ż","żaba","🐸"]
];
const DIGRAPHS = [
 ["CH","chleb","🍞"],["CZ","czapka","🧢"],["SZ","szachy","♟️"],["RZ","rzeka","🏞️"],
 ["DZ","dzwon","🔔"],["DŹ","dźwig","🏗️"],["DŻ","dżem","🍓"]
];
const VOWELS = "AĄEĘIOÓUY";
const CONS = ["M","T","L","P","B","D","K","S","N","W","R","Z","G","J","F","C","H","Ł"];
// słowa: sylaby rozdzielone "-", emoji, poziom
const WORDS = [
 // poziom 1: proste sylaby otwarte
 ["MA-MA","👩",1],["TA-TA","👨",1],["LA-LA","🪆",1],["LA-MA","🦙",1],["KO-ZA","🐐",1],
 ["SO-WA","🦉",1],["NO-GA","🦵",1],["RY-BA","🐟",1],["KU-RA","🐔",1],["WO-DA","💧",1],
 ["LO-DY","🍦",1],["BU-TY","👟",1],["NU-TY","🎵",1],["KA-WA","☕",1],["AU-TO","🚗",1],
 ["O-KO","👁️",1],["MO-RZE","🌊",1],["DY-NIA","🎃",1],["ŻA-BA","🐸",1],["RĘ-KA","✋",1],
 // poziom 2: krótkie słowa i sylaby zamknięte
 ["KOT","🐱",2],["DOM","🏠",2],["LIS","🦊",2],["SER","🧀",2],["SOK","🧃",2],
 ["NOS","👃",2],["TORT","🎂",2],["PIES","🐶",2],["BA-NAN","🍌",2],["RO-WER","🚲",2],
 ["ZE-GAR","⏰",2],["MYSZ","🐭",2],["MIŚ","🧸",2],["SŁOŃ","🐘",2],["KOŃ","🐴",2],
 ["PTAK","🐦",2],["KRO-WA","🐄",2],["PIŁ-KA","⚽",2],["LA-TAW-IEC","🪁",9],
 // poziom 3: dwuznaki i trudniejsze
 ["CHLEB","🍞",3],["JAJ-KO","🥚",3],["JA-BŁ-KO","🍎",9],["JABŁ-KO","🍎",3],["GRUSZ-KA","🍐",3],
 ["KACZ-KA","🦆",3],["ŚWI-NIA","🐷",3],["MAR-CHEW","🥕",3],["KSIĄŻ-KA","📖",3],
 ["SŁOŃ-CE","☀️",3],["KSIĘ-ŻYC","🌙",3],["GWIAZ-DA","⭐",3],["DESZCZ","🌧️",3],
 ["KWIAT","🌸",3],["LIŚĆ","🍃",3],["CZAP-KA","🧢",3],["SZA-CHY","♟️",3],["DZWON","🔔",3],
 ["RZE-KA","🏞️",3],["DŻEM","🍓",3]
].filter(w=>w[2]!==9).map(([s,e,l])=>({syl:s.split("-"),word:s.replace(/-/g,""),emoji:e,level:l}));

// ---------- STAN ----------
let lower=false, stars=0;
try{ stars=+localStorage.getItem("czytanka_stars")||0; lower=localStorage.getItem("czytanka_lower")==="1"; }catch(e){}
const $=s=>document.querySelector(s);
const app=$("#app");
function saveStars(){ $("#stars").textContent=stars; try{localStorage.setItem("czytanka_stars",stars)}catch(e){} }
function applyCase(){ document.body.classList.toggle("lower",lower); $("#caseBtn").textContent=lower?"aa":"AA"; }
$("#caseBtn").onclick=()=>{ lower=!lower; applyCase(); try{localStorage.setItem("czytanka_lower",lower?"1":"0")}catch(e){} };
$("#home").onclick=()=>menu();
saveStars(); applyCase();

// ---------- MOWA ----------
let plVoice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); plVoice=bestPl(v); }catch(e){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text,rate=0.95){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.toLowerCase());
    u.lang="pl-PL"; if(plVoice) u.voice=plVoice; u.rate=rate; u.pitch=1.0;
    speechSynthesis.speak(u);
  }catch(e){}
}
function sayParts(parts,then){
  // czyta sylaby po kolei, potem całe słowo
  try{
    speechSynthesis.cancel();
    parts.forEach(p=>{ const u=new SpeechSynthesisUtterance(p.toLowerCase()); u.lang="pl-PL"; if(plVoice)u.voice=plVoice; u.rate=0.85; speechSynthesis.speak(u); });
    if(then){ const u=new SpeechSynthesisUtterance(then.toLowerCase()); u.lang="pl-PL"; if(plVoice)u.voice=plVoice; u.rate=0.95; speechSynthesis.speak(u); }
  }catch(e){}
}
const PRAISE=["Brawo!","Super!","Świetnie!","Ekstra!","Wspaniale!","Tak jest!"];
function cheer(x,y){
  stars++; saveStars();
  const list=["⭐","🌟","✨","🎉","💛"];
  for(let i=0;i<12;i++){
    const b=document.createElement("div"); b.className="burst"; b.textContent=list[i%list.length];
    b.style.left=(x||innerWidth/2)+"px"; b.style.top=(y||innerHeight/2)+"px";
    const a=Math.random()*Math.PI*2, r=90+Math.random()*120;
    b.style.setProperty("--dx",Math.cos(a)*r+"px"); b.style.setProperty("--dy",Math.sin(a)*r+"px");
    document.body.appendChild(b); setTimeout(()=>b.remove(),1000);
  }
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sylHTML=w=>w.syl.map((s,i)=>`<span class="syl uc" data-i="${i}">${s}</span>`).join("");
function topBar(title){ return `<div class="top"><button class="back" id="bk">⬅</button><h2>${title}</h2></div>`; }
function bindBack(){ $("#bk").onclick=menu; }

// ---------- MENU ----------
function menu(){
  try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=`
  <p class="hello">Cześć! W co dziś gramy? 😊</p>
  <div id="warn" class="warn">Ta przeglądarka nie ma polskiego głosu — aplikacja działa, ale bez czytania na głos. Najlepiej otworzyć w Safari lub Chrome.</div>
  <div class="menu">
    <button class="tile" style="background:var(--c1)" data-m="letters"><span class="ic">🔤</span>Literki<small>poznaj alfabet</small></button>
    <button class="tile" style="background:var(--c2)" data-m="syllables"><span class="ic">🧩</span>Sylaby<small>MA, ME, MI…</small></button>
    <button class="tile" style="background:var(--c3)" data-m="words"><span class="ic">📖</span>Czytam słowa<small>sylaba po sylabie</small></button>
    <button class="tile" style="background:var(--c4)" data-m="quiz"><span class="ic">🖼️</span>Znajdź obrazek<small>przeczytaj i wybierz</small></button>
    <button class="tile" style="background:var(--c6)" data-m="build"><span class="ic">🧱</span>Ułóż słowo<small>z sylab</small></button>
    <button class="tile" style="background:#fbcfe8" data-m="showSay"><span class="ic">🗣️</span>Pokaż i powiedz<small>jaka to literka?</small></button>
    <button class="tile" style="background:#ddd6fe" data-m="hearPick"><span class="ic">👂</span>Usłysz i wskaż<small>znajdź literkę</small></button>
    <button class="tile" style="background:#fed7aa" data-m="firstLetter"><span class="ic">🍉</span>Na jaką literkę?<small>pierwsza głoska</small></button>
    <button class="tile" style="background:#a7f3d0" data-m="sentences"><span class="ic">✍️</span>Zdania<small>poziom 2</small></button>
    <button class="tile" style="background:#fde68a" data-m="sentPic"><span class="ic">🖼️</span>Zdanie i obrazek<small>poziom 2</small></button>
    <button class="tile" style="background:#bfdbfe" data-m="stories"><span class="ic">📚</span>Czytanki<small>czytam i odpowiadam</small></button>
    <button class="tile" style="background:var(--c5);color:#fff" data-m="parents"><span class="ic">👨‍👩‍👦</span>Dla rodzica<small style="color:#f3efff">jak ćwiczyć</small></button>
  </div>`;
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>({letters,syllables,words,quiz,build,parents,sentences,sentPic,stories,showSay,hearPick,firstLetter})[t.dataset.m]());
  setTimeout(()=>{ try{ if(!("speechSynthesis" in window) || (speechSynthesis.getVoices().length && !plVoice)) $("#warn") && ($("#warn").style.display="block"); }catch(e){} },800);
}

// ---------- LITERKI ----------
function letters(){
  app.innerHTML=topBar("🔤 Literki")+`
  <div class="panel" id="lp"><div class="big uc">Aa</div><div class="hint">Dotknij literki poniżej</div></div>
  <div class="grid letters" id="lg"></div>
  <h3 style="margin:18px 0 8px">Dwie literki – jeden dźwięk</h3>
  <div class="grid letters" id="dg"></div>`;
  bindBack();
  const show=([L,w,e])=>{
    const i=w.toUpperCase().indexOf(L);
    const W=w.toUpperCase(); const mark=i>=0?W.slice(0,i)+`<b style="color:var(--s1)">${W.substr(i,L.length)}</b>`+W.slice(i+L.length):W;
    $("#lp").innerHTML=`<div class="big">${L}${L.length===1?" "+L.toLowerCase():" "+L.toLowerCase()}</div>
      <div class="emoji">${e}</div><div class="word uc" style="font-size:44px">${mark}</div>
      <div class="row"><button class="btn" id="again">🔊 Posłuchaj</button></div>`;
    const speak=()=>say(w);
    $("#again").onclick=speak; speak();
  };
  const fill=(el,arr)=>arr.forEach(x=>{
    const b=document.createElement("button"); b.className="key uc"+(VOWELS.includes(x[0])?" vow":""); b.textContent=x[0];
    b.onclick=()=>{document.querySelectorAll(".key.sel").forEach(k=>k.classList.remove("sel")); b.classList.add("sel"); show(x)};
    el.appendChild(b);
  });
  fill($("#lg"),LETTERS); fill($("#dg"),DIGRAPHS);
}

// ---------- SYLABY ----------
function syllables(){
  let cur="M";
  app.innerHTML=topBar("🧩 Sylaby")+`
  <p class="hint">Wybierz spółgłoskę, potem dotykaj sylab. <b style="color:var(--s1)">Czerwone</b> to samogłoski.</p>
  <div class="grid letters" id="cg"></div>
  <div class="panel" style="margin-top:14px"><div class="grid syls" id="sg"></div>
  <div class="row"><button class="btn alt" id="all">🔊 Przeczytaj wszystkie</button></div></div>`;
  bindBack();
  const render=()=>{
    const vs=["K","G","J"].includes(cur)?"AEIOU":"AEIOUY";
    const list=[...vs].map(v=>cur+v);
    $("#sg").innerHTML="";
    list.forEach(s=>{const b=document.createElement("button"); b.className="key uc"; b.innerHTML=`${cur}<span style="color:var(--s1)">${s.slice(cur.length)}</span>`; b.style.color="var(--ink)"; b.onclick=()=>say(s,0.88); $("#sg").appendChild(b)});
    $("#all").onclick=()=>sayParts(list);
  };
  CONS.forEach(c=>{const b=document.createElement("button"); b.className="key uc"+(c===cur?" sel":""); b.textContent=c;
    b.onclick=()=>{cur=c; document.querySelectorAll("#cg .key").forEach(k=>k.classList.remove("sel")); b.classList.add("sel"); render();};
    $("#cg").appendChild(b)});
  render();
}

// ---------- POZIOM ----------
let level=1;
function levelBar(cb){
  return `<div class="levels">${[1,2,3].map(l=>`<button class="lv ${l===level?"on":""}" data-l="${l}">${"⭐".repeat(l)}</button>`).join("")}</div>`;
}
function bindLevels(cb){ app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{level=+b.dataset.l; cb();}); }
const pool=()=>WORDS.filter(w=>w.level===level);

// ---------- CZYTAM SŁOWA ----------
function words(){
  let list=shuffle(pool()), i=0;
  const draw=()=>{
    const w=list[i];
    app.innerHTML=`<div class="top"><button class="back" id="bk">⬅</button><h2>📖 Czytam</h2>${levelBar()}</div>
    <div class="progress"><i style="width:${(i)/list.length*100}%"></i></div>
    <div class="panel">
      <div class="word" id="wd">${sylHTML(w)}</div>
      <p class="hint">Przeczytaj sam(a) 👀 — dotknij sylaby, żeby ją usłyszeć</p>
      <div class="emoji" id="em">❓</div>
      <div class="row">
        <button class="btn alt" id="show">🙈 Pokaż obrazek</button>
        <button class="btn" id="hear">🔊 Całe słowo</button>
      </div>
      <div class="row"><button class="btn go" id="next">Dalej ➡</button></div>
    </div>`;
    bindBack(); bindLevels(words);
    app.querySelectorAll(".syl").forEach(s=>s.onclick=()=>{ s.classList.add("hi"); setTimeout(()=>s.classList.remove("hi"),600); say(w.syl[+s.dataset.i],0.85); });
    $("#hear").onclick=()=>sayParts(w.syl,w.word);

// ---------- ZNAJDŹ OBRAZEK ----------
function quiz(){
  let n=0, score=0, tries=0; const ROUND=10;
  const next=()=>{
    if(n>=ROUND){ return done(); }
    const p=pool(); const w=p[Math.floor(Math.random()*p.length)];
    const others=shuffle(WORDS.filter(x=>x.emoji!==w.emoji)).slice(0,2);
    const opts=shuffle([w,...others]); tries=0;
    app.innerHTML=`<div class="top"><button class="back" id="bk">⬅</button><h2>🖼️ Znajdź obrazek</h2>${levelBar()}</div>
    <div class="progress"><i style="width:${n/ROUND*100}%"></i></div>
    <div class="panel">
      <div class="word">${sylHTML(w)}</div>
      <p class="hint">Przeczytaj słowo i dotknij pasującego obrazka</p>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.emoji}</button>`).join("")}</div>
      <div class="msg" id="msg"></div>
      <div class="row"><button class="btn" id="help">💡 Podpowiedź</button></div>
    </div>`;
    bindBack(); bindLevels(quiz);
    app.querySelectorAll(".syl").forEach(s=>s.onclick=()=>say(w.syl[+s.dataset.i],0.85));
    $("#help").onclick=()=>sayParts(w.syl);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=e=>{
      const o=opts[+b.dataset.k];
      if(o===w){
        b.classList.add("good"); const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];
        $("#msg").className="msg ok"; $("#msg").textContent=p+" "+w.word.charAt(0)+w.word.slice(1).toLowerCase()+"!";
        say(p+" "+w.word); if(tries===0) score++; cheer(e.clientX,e.clientY);
        app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        n++; setTimeout(next,1600);
      } else {
        tries++; b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
        $("#msg").className="msg no"; $("#msg").textContent="Spróbuj jeszcze raz 🙂"; say("Spróbuj jeszcze raz");
      }
    });
  };
  const done=()=>{
    app.innerHTML=topBar("🖼️ Znajdź obrazek")+`<div class="panel"><div class="emoji">🏆</div>
      <div class="word" style="font-size:48px">${score} / ${ROUND}</div>
      <p class="msg ok">${score>=8?"Jesteś mistrzem czytania!":score>=5?"Bardzo ładnie!":"Dobra robota, ćwiczymy dalej!"}</p>
      <div class="row"><button class="btn go" id="again">🔁 Jeszcze raz</button></div></div>`;
    bindBack(); say(score>=8?"Jesteś mistrzem czytania!":"Dobra robota!"); $("#again").onclick=quiz;
  };
  next();
}

// ---------- UŁÓŻ SŁOWO ----------
function build(){
  const draw=()=>{
    let p=pool().filter(w=>w.syl.length>=2); if(!p.length) p=WORDS.filter(w=>w.syl.length>=2);
    const w=p[Math.floor(Math.random()*p.length)];
    let pieces=shuffle(w.syl.map((s,i)=>({s,i}))); if(pieces.every((x,k)=>x.i===k)) pieces.reverse();
    let pos=0;
    app.innerHTML=`<div class="top"><button class="back" id="bk">⬅</button><h2>🧱 Ułóż słowo</h2>${levelBar()}</div>
    <div class="panel">
      <div class="emoji">${w.emoji}</div>
      <p class="hint">Dotykaj sylab w dobrej kolejności</p>
      <div class="slots">${w.syl.map(()=>`<div class="slot"></div>`).join("")}</div>
      <div class="pieces">${pieces.map((x,k)=>`<button class="piece uc" data-k="${k}">${x.s}</button>`).join("")}</div>
      <div class="msg" id="msg"></div>
      <div class="row"><button class="btn" id="help">🔊 Posłuchaj</button><button class="btn go" id="next">Następne ➡</button></div>
    </div>`;
    bindBack(); bindLevels(build);
    $("#help").onclick=()=>say(w.word);
    $("#next").onclick=draw;
    const slots=app.querySelectorAll(".slot");
    app.querySelectorAll(".piece").forEach(b=>b.onclick=e=>{
      const x=pieces[+b.dataset.k];
      say(x.s,0.85);
      if(x.s===w.syl[pos]){
        slots[pos].textContent=x.s; slots[pos].classList.add("uc", pos%2?"f2":"f1"); b.disabled=true; pos++;
        if(pos===w.syl.length){ $("#msg").className="msg ok"; $("#msg").textContent="Brawo! 🎉"; setTimeout(()=>say("Brawo! "+w.word),500); cheer(e.clientX,e.clientY); setTimeout(draw,2200); }
      } else { b.classList.remove("wrong"); void b.offsetWidth; b.style.animation="shake .4s"; setTimeout(()=>b.style.animation="",400); $("#msg").className="msg no"; $("#msg").textContent="Hmm, która sylaba jest pierwsza?"; }
    });
  };
  draw();
}

const LSETS=[

 ["Pierwsze litery","AOUIEMTLPDKBSWRN".split("")],

  const list=LSETS[lset][1], w=weak(), bag=[];
  list.forEach(L=>{const n=1+Math.min(3,w[L]||0)*2; for(let i=0;i<n;i++) bag.push(L)});

}

      <p class="hint">Dobrze: ${ok} z ${all}</p></div>`;
    bindBack(); bindSet(()=>{L=nextLetter();draw()});
    $("#chk").onclick=()=>{ $("#ans").innerHTML=e?`<div class="emoji">${e}</div><div class="word uc" style="font-size:34px">${w.toUpperCase()}</div>`:""; say(`${L.toLowerCase()}. ${L.toLowerCase()} jak ${w}`,0.9); $("#judge").style.display="flex"; };
    $("#yes").onclick=ev=>{const W=weak(); W[L]=Math.max(0,(W[L]||0)-1); setWeak(W); ok++; all++; cheer(ev.clientX,ev.clientY); say(pick(PRAISE)); L=nextLetter(L); setTimeout(draw,700)};
    $("#no").onclick=()=>{const W=weak(); W[L]=(W[L]||0)+1; setWeak(W); all++; say("Nic nie szkodzi. Ta literka wróci jeszcze."); L=nextLetter(L); setTimeout(draw,500)};
  };
  draw();
}
function hearPick(){
  let n=0, score=0; const ROUND=10;
  const next=()=>{
    if(n>=ROUND){app.innerHTML=topBar("👂 Usłysz i wskaż")+`<div class="panel"><div class="emoji">🏆</div><div class="word" style="font-size:48px">${score} / ${ROUND}</div>
      <div class="row"><button class="btn go" id="again">🔁 Jeszcze raz</button></div></div>`;bindBack();$("#again").onclick=hearPick;say(score>=8?"Super! Znasz literki!":"Dobra robota!");return;}
    const list=LSETS[lset][1], L=nextLetter(), k=Math.min(list.length,lset===0?4:6);
    const opts=shuffle([L,...shuffle(list.filter(x=>x!==L)).slice(0,k-1)]); let tries=0;
    app.innerHTML=topBar("👂 Usłysz i wskaż")+setPicker()+`<div class="progress"><i style="width:${n/ROUND*100}%"></i></div><div class="panel">
      <p class="hint">Posłuchaj i dotknij literki</p><div class="row"><button class="btn" id="again">🔊 Posłuchaj jeszcze raz</button></div>
      <div class="opts" style="grid-template-columns:repeat(3,1fr)">${opts.map((o,j)=>`<button class="opt uc" data-j="${j}" style="font-size:56px;font-weight:700;color:var(--ink)">${o}</button>`).join("")}</div>
      <div class="msg" id="msg"></div></div>`;
    bindBack(); bindSet(hearPick);
    const ask=()=>sayLetter(L); $("#again").onclick=ask; ask();
    app.querySelectorAll(".opt").forEach(b=>b.onclick=ev=>{
      if(opts[+b.dataset.j]===L){b.classList.add("good");app.querySelectorAll(".opt").forEach(x=>x.disabled=true);const [,w]=exOf(L);
        $("#msg").className="msg ok";$("#msg").textContent=pick(PRAISE);say(`${pick(PRAISE)} ${L.toLowerCase()} jak ${w}`);if(!tries)score++;
        const W=weak(); if(!tries) W[L]=Math.max(0,(W[L]||0)-1); setWeak(W); cheer(ev.clientX,ev.clientY); n++; setTimeout(next,1900);}
      else{tries++;b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");const W=weak();W[L]=(W[L]||0)+1;setWeak(W);
        $("#msg").className="msg no";$("#msg").textContent="Posłuchaj jeszcze raz 🙂";
        if(tries>1){const [,w]=exOf(L);say(`${L.toLowerCase()} jak ${w}`)}else say("Spróbuj jeszcze raz. "+"litera "+L.toLowerCase());}
    });
  };
  next();
}
function firstLetter(){
  const POOL=[...LETTERS,...DIGRAPHS].filter(([L,w])=>w.toUpperCase().startsWith(L));
  let n=0,score=0;const ROUND=10;
  const next=()=>{
    if(n>=ROUND){app.innerHTML=topBar("🍉 Na jaką literkę?")+`<div class="panel"><div class="emoji">🏆</div><div class="word" style="font-size:48px">${score} / ${ROUND}</div>
      <div class="row"><button class="btn go" id="again">🔁 Jeszcze raz</button></div></div>`;bindBack();$("#again").onclick=firstLetter;say("Dobra robota!");return;}
    const set=LSETS[lset][1]; let src=POOL.filter(x=>set.includes(x[0])); if(src.length<3) src=POOL;
    const [L,w,e]=pick(src); const others=shuffle(POOL.map(x=>x[0]).filter(x=>x!==L&&!w.toUpperCase().startsWith(x))).slice(0,2);
    const opts=shuffle([L,...others]); let tries=0;
    app.innerHTML=topBar("🍉 Na jaką literkę?")+setPicker()+`<div class="progress"><i style="width:${n/ROUND*100}%"></i></div><div class="panel">
      <div class="emoji" style="font-size:110px">${e}</div><p class="hint">Na jaką literkę zaczyna się to słowo?</p>
      <div class="row"><button class="btn" id="again">🔊 Posłuchaj</button></div>
      <div class="opts">${opts.map((o,j)=>`<button class="opt uc" data-j="${j}" style="font-size:56px;font-weight:700;color:var(--ink)">${o}</button>`).join("")}</div>
      <div class="msg" id="msg"></div></div>`;
    bindBack(); bindSet(firstLetter);
    const ask=()=>say(w+". Na jaką literkę?",0.9); $("#again").onclick=ask; ask();
    app.querySelectorAll(".opt").forEach(b=>b.onclick=ev=>{
      if(opts[+b.dataset.j]===L){b.classList.add("good");app.querySelectorAll(".opt").forEach(x=>x.disabled=true);$("#msg").className="msg ok";
        $("#msg").innerHTML=`<span class="uc">${w.toUpperCase()}</span>`;say(`${pick(PRAISE)} ${w} zaczyna się na ${L.toLowerCase()}`);if(!tries)score++;cheer(ev.clientX,ev.clientY);n++;setTimeout(next,2000);}
      else{tries++;b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");$("#msg").className="msg no";$("#msg").textContent="Powiedz słowo powoli i posłuchaj początku 🙂";say("Powiedz powoli: "+w);}
    });
  };
  next();
}
