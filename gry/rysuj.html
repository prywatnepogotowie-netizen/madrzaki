main{max-width:820px;margin:0 auto;padding:14px 14px 90px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}

.sw.on{box-shadow:0 0 0 4px #2b2d42;transform:scale(1.1)}
.sizes{display:flex;gap:8px;justify-content:center;margin-top:8px}
.sz{width:44px;height:44px;border-radius:12px;border:none;background:#fff;box-shadow:0 3px 0 #f0c6d8;cursor:pointer;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:#2b2d42}
.sz.on{outline:3px solid #2b2d42}
.parent{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 5px 0 #f8d4e4;font-size:16px;line-height:1.55;margin-top:16px}
#home{position:fixed;left:12px;bottom:12px;z-index:9999;background:#2b2d42;color:#fff;text-decoration:none;font:700 15px system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
@media print{header,#home,.tools,.pal,.sizes,.parent,.hello{display:none!important}.wrap{box-shadow:none}body{background:#fff}}
