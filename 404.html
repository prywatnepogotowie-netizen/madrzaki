<script>
/* Adresy wpisane wielkimi literami (np. /BLOG) przenosimy na właściwe (małe litery) */
(function(){
  var p=location.pathname, low=p.toLowerCase();
  if(p!==low){ location.replace(low+location.search+location.hash); }
})();
</script>
